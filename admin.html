<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | — Grup Pemuda`友</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">友</span><span>— Grup Pemuda<small>OWNER DASHBOARD</small></span></a><nav><a href="/">← Website</a></nav></header><main class="wrap admin-wrap"><div class="eyebrow">PRIVATE CONTROL CENTER</div><h1 style="font:600 clamp(34px,6vw,54px) 'Space Grotesk';margin-bottom:8px">Dashboard Owner</h1><p class="muted">Login diperlukan. Hanya akun yang ditandai sebagai Owner di database yang boleh mengelola grup.</p><section id="login-panel" class="panel admin-panel"><h2>Masuk</h2><form id="login-form" class="form-grid"><label>Email Owner<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Login Owner</button><p id="login-status" class="status"></p></form></section><section id="dashboard" class="panel admin-panel hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Kelola grup</h2><button id="logout" class="btn secondary" type="button">Keluar</button></div><form id="group-form" class="form-grid"><label>Nama grup<input name="name" required maxlength="80"></label><div class="split"><label>Kategori<input name="category" placeholder="Anime, gaming, umum"></label><label>Link undangan WhatsApp<input name="invite_url" required placeholder="https://chat.whatsapp.com/..."></label></div><label>Deskripsi<textarea name="description" rows="3" maxlength="300"></textarea></label><label><span><input type="checkbox" name="is_published" checked style="width:auto;margin-right:8px">Publikasikan grup</span></label><button class="btn primary" type="submit">Simpan grup</button><p id="group-status" class="status"></p></form><div id="admin-groups" class="admin-list"></div><h2>Statistik kunjungan</h2><p id="visit-count" class="muted">Memuat statistik…</p><h2>Intro member menunggu</h2><div id="admin-intros" class="admin-list"></div></section></main><script type="module" src="/admin.js"></script></body></html>
